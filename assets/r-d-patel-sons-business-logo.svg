  <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#758b27"/><stop offset="1" stop-color="#34491b"/></linearGradient>
  <path id="addressArc" d="M210 820 Q500 982 790 820"/>
</defs>
<circle cx="500" cy="500" r="488" fill="url(#cream)" stroke="#4b2812" stroke-width="18"/>
