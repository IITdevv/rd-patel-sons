<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" role="img" aria-labelledby="title desc">
<title id="title">R D Patel &amp; Sons</title>
<desc id="desc">Circular tobacco processor badge with leaf, RD monogram, company name, founding year, fields and Rakhiyal location.</desc>
<defs>
  <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#d39a32"/><stop offset=".5" stop-color="#f0c65e"/><stop offset="1" stop-color="#a86b20"/></linearGradient>
